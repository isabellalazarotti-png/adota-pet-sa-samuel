<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adota Pet - Sistema de Adoção</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🐾 Sistema de Adoção de Pets</h1>

    <!-- Formulário de Cadastro/Edição -->
    <div class="card-form">
      <h2 id="form-title">Cadastrar Novo Pet</h2>
      <form id="pet-form">
        <input type="hidden" id="pet-id">
        <input type="text" id="nome" placeholder="Nome do Pet" required>
        <input type="text" id="especie" placeholder="Espécie (ex: Cachorro, Gato)" required>
        <input type="text" id="idade" placeholder="Idade (ex: 2 anos)" required>
        <select id="status">
          <option value="Disponível">Disponível</option>
          <option value="Adotado">Adotado</option>
        </select>
        <button type="submit" id="btn-submit">Salvar Pet</button>
        <button type="button" id="btn-cancel" style="display:none;" onclick="resetForm()">Cancelar</button>
      </form>
    </div>

    <!--  de Pets -->
    <h2>Pets Cadastrados</h2>
    <div id="pets-list" class="pets-grid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
